# Auto-deploy to Fly.io on every push to main.
#
# One-time setup (per pump / per Fly app):
#   1) Make a deploy token:         fly tokens create deploy -a <your-app>
#   2) GitHub repo → Settings → Secrets and variables → Actions:
#        • New repository SECRET:   FLY_API_TOKEN = <the token from step 1>
#        • New repository VARIABLE: FLY_APP       = <your-app>   (e.g. haroonpetro)
#
# After that, every push here builds the Docker image on Fly and updates the live app.
# The persistent volume (database + backups) is never touched by a deploy.
name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also lets you run it by hand from the Actions tab

concurrency:
  group: fly-deploy
  cancel-in-progress: false   # never interrupt a deploy in flight

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        id: setup
        continue-on-error: true   # its download host sometimes answers 503 — fall back below instead of skipping the deploy
      - name: Install flyctl (fallback)
        if: steps.setup.outcome == 'failure'
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL https://fly.io/install.sh | sh; then break; fi
            echo "flyctl install failed, retry $i"; sleep $((i * 10))
          done
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Deploy
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::Set a repository SECRET named FLY_API_TOKEN (fly tokens create deploy -a petrol-pumpai) — Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          # App name comes from the repository VARIABLE FLY_APP if set, otherwise from fly.toml (app = "petrol-pumpai").
          APP_ARGS=(); if [ -n "${FLY_APP}" ]; then APP_ARGS=(--app "${FLY_APP}"); fi
          # Fly's remote builder sometimes drops the connection mid-build ("connection reset", "deadline exceeded").
          # Retry: 1st try the default (Depot) builder, then Fly's own builder; each try is capped so a hang cannot eat the job.
          for i in 1 2 3; do
            if [ "$i" = 1 ]; then EXTRA=(); else EXTRA=(--depot=false); fi
            echo "::group::Deploy try $i ${EXTRA[*]}"
            if timeout 15m flyctl deploy --remote-only "${APP_ARGS[@]}" "${EXTRA[@]}"; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "::warning::Fly deploy try $i failed — retrying in $((i * 30))s"; sleep $((i * 30))
          done
          echo "::error::Fly deploy failed 3 times (Fly builder). Run it again from Actions → Fly Deploy → Run workflow."
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
